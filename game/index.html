<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: 8px; bottom: 8px; z-index: 5; font: 13px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.65); padding: 4px 8px; border-radius: 4px; display: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Bay: a top-down open-world crime game. Drive, steal cars, escape the police and finish five story missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="selftest">SELFTEST: pending</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
